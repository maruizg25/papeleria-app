<div class="lista-container">
    <div class="header">
        <h1>Gestión de Clientes</h1>
        <button mat-flat-button color="primary" (click)="openClienteDialog()">
            <mat-icon>add</mat-icon>
            Añadir Cliente
        </button>
    </div>

    <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar cliente...</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Juan Pérez">
        <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="table-container mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
                <td mat-cell *matCellDef="let cliente"> {{cliente.nombre}} </td>
            </ng-container>
            <ng-container matColumnDef="nro_doc">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Documento </th>
                <td mat-cell *matCellDef="let cliente"> {{cliente.nro_doc}} </td>
            </ng-container>
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                <td mat-cell *matCellDef="let cliente"> {{cliente.email}} </td>
            </ng-container>
            <ng-container matColumnDef="telefono">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Teléfono </th>
                <td mat-cell *matCellDef="let cliente"> {{cliente.telefono}} </td>
            </ng-container>
            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let cliente">
                    <button mat-icon-button color="primary" (click)="openClienteDialog(cliente)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="eliminarCliente(cliente)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                    No se encontraron clientes.
                </td>
            </tr>
        </table>
        <mat-paginator [pageSizeOptions]="[10, 25, 100]" showFirstLastButtons></mat-paginator>
    </div>
</div>
